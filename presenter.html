<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presenter view · Mind over Machine</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=20261114g">
  <style>
    body::after { display: none; }
    .pv { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr auto; gap: 1rem; min-height: 100vh; padding: 1rem; }
    .pv__bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 1.5rem; color: var(--text-dim); font-size: 1rem; flex-wrap: wrap; }
    .pv__bar strong { color: var(--text); }
    .pv__spacer { flex: 1; }
    .pv__time { font-family: var(--mono); font-size: 1.6rem; color: var(--text); }
    .pv__timer { color: var(--accent); }
    .pv__list { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; align-content: start; }
    .pv__list button { width: 100%; text-align: left; display: flex; gap: .7rem; padding: .65rem .8rem; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--text-dim); font: inherit; font-size: .95rem; cursor: pointer; }
    .pv__list button:hover { border-color: var(--accent); color: var(--text); }
    .pv__list button.is-current { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
    .pv__list span { font-family: var(--mono); color: var(--accent); }
    .pv__main { display: grid; grid-template-rows: auto 1fr; gap: .8rem; min-height: 0; }
    .pv__now { font-size: clamp(1.4rem, 2.4vw, 2.2rem); font-weight: 750; }
    .pv__next { color: var(--text-faint); font-size: 1rem; margin-top: .3rem; }
    .pv__notes { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.2rem 1.4rem; overflow: auto; font-size: clamp(1.05rem, 1.4vw, 1.3rem); line-height: 1.55; }
    .pv__controls { grid-column: 1 / -1; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .pv__status { margin-left: auto; color: var(--text-faint); font-size: .9rem; }
    .pv__status.is-ok { color: var(--human); }
    @media (max-width: 800px) { .pv { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="pv">
    <header class="pv__bar">
      <strong>Presenter view</strong>
      <span class="pv__spacer"></span>
      <span>Elapsed <span class="pv__time pv__timer" id="pvTimer">00:00</span></span>
      <button class="btn btn--ghost btn--sm" type="button" id="pvTimerReset" title="Reset timer (R)">Reset</button>
      <span class="pv__time" id="pvClock">--:--</span>
    </header>

    <nav aria-label="Sections"><ol class="pv__list" id="pvList"></ol></nav>

    <section class="pv__main" aria-live="polite">
      <div>
        <div class="pv__now" id="pvNow">Waiting for the event page…</div>
        <div class="pv__next" id="pvNext"></div>
      </div>
      <div class="pv__notes" id="pvNotes"><p class="hint">Open this window with <kbd>P</kbd> from the event page.</p></div>
    </section>

    <footer class="pv__controls">
      <button class="btn" type="button" id="pvPrev">‹ Previous section</button>
      <button class="btn btn--primary" type="button" id="pvNext2">Next section ›</button>
      <button class="btn btn--ghost" type="button" id="pvBlack" title="Blank the audience screen (B)">Blank screen</button>
      <span class="hint">Keys: <kbd>←</kbd> <kbd>→</kbd> sections · <kbd>B</kbd> blank · <kbd>R</kbd> reset timer</span>
      <span class="pv__status" id="pvStatus">Not connected</span>
    </footer>
  </div>

  <script src="js/notes.js?v=20261114g"></script>
  <script src="js/notes-render.js?v=20261114g"></script>
  <script>
  (function () {
    "use strict";
    var APP = "qa-citizen-dev-deck";
    var $ = function (id) { return document.getElementById(id); };
    var channel = null, seq = 0, connected = false, listBuilt = false;

    function send(msg) {
      msg.app = APP;
      msg.seq = Date.now() + "-" + (++seq);
      if (channel) try { channel.postMessage(msg); } catch (e) {}
      if (window.opener && !window.opener.closed) try { window.opener.postMessage(msg, "*"); } catch (e) {}
    }

    function onState(m) {
      if (!m || m.type !== "state") return;
      if (!connected) { connected = true; $("pvStatus").textContent = "Connected to event page"; $("pvStatus").classList.add("is-ok"); }
      if (!listBuilt && m.sections) {
        m.sections.forEach(function (s, i) {
          var li = document.createElement("li"), b = document.createElement("button");
          b.type = "button";
          b.innerHTML = "<span>" + (i + 1) + "</span>";
          b.appendChild(document.createTextNode(s.label));
          b.addEventListener("click", function () { send({ type: "cmd", action: "go", index: i }); });
          li.appendChild(b); $("pvList").appendChild(li);
        });
        listBuilt = true;
      }
      Array.prototype.forEach.call($("pvList").querySelectorAll("button"), function (b, i) { b.classList.toggle("is-current", i === m.index); });
      $("pvNow").textContent = (m.index + 1) + " · " + m.label;
      var nx = m.sections && m.sections[m.index + 1];
      $("pvNext").textContent = nx ? "Next: " + nx.label : "Last section";
      $("pvNotes").innerHTML = window.renderNotes(m.id);
    }

    if ("BroadcastChannel" in window) {
      try { channel = new BroadcastChannel(APP); channel.onmessage = function (e) { onState(e.data); }; } catch (e) {}
    }
    window.addEventListener("message", function (e) { if (e.source === window.opener) onState(e.data); });

    $("pvNext2").addEventListener("click", function () { send({ type: "cmd", action: "next" }); });
    $("pvPrev").addEventListener("click", function () { send({ type: "cmd", action: "prev" }); });
    $("pvBlack").addEventListener("click", function () { send({ type: "blackout" }); });
    document.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      switch (e.key) {
        case "ArrowRight": case "PageDown": case "ArrowDown": e.preventDefault(); send({ type: "cmd", action: "next" }); break;
        case "ArrowLeft": case "PageUp": case "ArrowUp": e.preventDefault(); send({ type: "cmd", action: "prev" }); break;
        case "b": case "B": case ".": send({ type: "blackout" }); break;
        case "r": case "R": resetTimer(); break;
      }
    });

    var t0 = Date.now();
    function pad(n) { return String(n).padStart(2, "0"); }
    function resetTimer() { t0 = Date.now(); tick(); }
    function tick() {
      var d = new Date();
      $("pvClock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
      var s = Math.floor((Date.now() - t0) / 1000);
      $("pvTimer").textContent = (s >= 3600 ? Math.floor(s / 3600) + ":" : "") + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
    }
    $("pvTimerReset").addEventListener("click", resetTimer);
    setInterval(tick, 1000); tick();

    send({ type: "hello" });
    setTimeout(function () { if (!connected) $("pvStatus").textContent = "Not connected: open this window with P from the event page"; }, 1500);
  })();
  </script>
</body>
</html>
